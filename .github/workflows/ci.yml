name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: package/v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package/v2/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Verify sealed package and V1 preservation
        run: python tools/verify.py
      - name: Install locked validation dependencies
        run: npm ci
      - name: Domain and tool tests
        run: |
          npm test
          npm run test:tools
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser and exported-template tests
        run: |
          npm run test:browser
          npm run test:export
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-validation-evidence
          path: package/v2/evidence
          retention-days: 14
