name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: package/v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package/v2/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Verify sealed package and V1 preservation
        run: python tools/verify.py
      - name: Verify standalone page-skill seal
        run: python ../../tools/verify_page_skills.py
      - name: Install locked validation dependencies
        run: npm ci
      - name: Domain and tool tests
        run: |
          npm test
          npm run test:tools
      - name: Original bounded physics invariants
        run: node ../../tools/test_physics_engine.mjs
      - name: Pricing units, precision and unknown costs
        run: node ../../tools/test_pricing_model.mjs
      - name: Editorial catalog, cursors and cancellation
        run: node ../../tools/test_editorial_catalog.mjs
      - name: Product estimate, stock and unknown fees
        run: node ../../tools/test_product_model.mjs
      - name: Collection queries, facets and cursor revisions
        run: node ../../tools/test_collection_model.mjs
      - name: Page-skill contracts, source linkage and standalone exports
        run: python ../../tools/test_page_skills.py
      - name: Interaction patterns and license preservation
        run: python ../../tools/test_interaction_skills.py
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser and exported-template tests
        run: |
          npm run test:browser
          npm run test:export
      - name: Standalone page-skill browser validation
        run: node ../../tools/test_page_skills.mjs
      - name: Distinct interaction patterns and failure recovery
        run: node ../../tools/test_interaction_skills.mjs
      - name: Story and prompt-detail state validation
        run: node ../../tools/test_creative_page_skills.mjs
      - name: Source readiness and non-interfering observation
        run: node ../../tools/test_source_readiness.mjs
      - name: Unambiguous source control targeting
        run: node ../../tools/test_source_target.mjs
      - name: Styled source fields and visible associated labels
        run: node ../../tools/test_source_fields.mjs
      - name: Continuous source dialogs and verified close
        run: node ../../tools/test_source_sequence.mjs
      - name: Bounded physics inputs and lifecycle
        run: node ../../tools/test_physics_pattern.mjs
      - name: Pricing comparison and estimate recovery
        run: node ../../tools/test_pricing_page.mjs
      - name: Editorial browsing, reading and recovery
        run: node ../../tools/test_editorial_page.mjs
      - name: Product gallery, options and estimate recovery
        run: node ../../tools/test_product_page.mjs
      - name: Collection live filters, details and recovery
        run: node ../../tools/test_collection_page.mjs
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-validation-evidence
          path: |
            package/v2/evidence
            research/page_skill_validation
            research/interaction_skill_validation
            research/creative_page_validation
            research/source_state_validation
            research/physics_skill_validation
            research/pricing_skill_validation
            research/editorial_skill_validation
            research/product_skill_validation
            research/collection_skill_validation
          retention-days: 14
